

<svg width="400" height="400" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">

  <defs>
    <style>
      .outline    { fill: #202020; }
      .hat-red    { fill: #e74c3c; }
      .hat-shadow { fill: #c0392b; }
      .hat-white  { fill: #ecf0f1; }
      .hat-grey   { fill: #95a5a6; }
      .hair       { fill: #2c3e50; }
      .skin       { fill: #ffcc99; }
      .skin-shadow{ fill: #e6b07e; }
      .eye        { fill: #000000; }
      .scarf      { fill: #e74c3c; }
      .vest       { fill: #253f5a; }
      .vest-light { fill: #34495e; }
      .bag        { fill: #f1c40f; }
      .pants      { fill: #11639a; }
      .shoes      { fill: #c0392b; }
      .shoes-dark { fill: #202020; }
      .white      { fill: #ffffff; }
    </style>
  </defs>


  

    
    <g transform="translate(37, 1) scale(-1, 1)">


    

    

    <!-- HAT -->
    <!-- Row 1 -->
    <rect x="12" y="0" width="6" height="1" class="hat-shadow" />
    <rect x="13" y="0" width="4" height="1" class="hat-red" />
    <!-- Row 2 -->
    <rect x="10" y="1" width="10" height="1" class="hat-shadow" />
    <rect x="11" y="1" width="8" height="1" class="hat-red" />
    <!-- Row 3 -->
    <rect x="9" y="2" width="12" height="1" class="hat-shadow" />
    <rect x="10" y="2" width="10" height="1" class="hat-red" />
    <!-- Row 4 -->
    <rect x="8" y="3" width="14" height="1" class="hat-shadow" />
    <rect x="9" y="3" width="12" height="1" class="hat-red" />
    <!-- Row 5 -->
    <rect x="8" y="4" width="14" height="3" class="hat-red" />
    <rect x="7" y="4" width="1" height="3" class="hat-shadow" /> <!-- Left Outline -->
    <rect x="22" y="4" width="1" height="3" class="hat-shadow" /> <!-- Right Outline -->
    
    
    



    <!-- Head -->

    <rect x="10" y="6" width="10" height="10" class="skin" />
    <rect x="9" y="7" width="12" height="7" class="skin" />
    <rect x="8" y="7" width="14" height="6" class="skin" />
    <rect x="8" y="7" width="7" height="6" class="outline" />
    <rect x="9" y="6" width="6" height="8" class="outline" />
    <rect x="15" y="6" width="2" height="4" class="outline" />
    <rect x="17" y="6" width="2" height="2" class="outline" />
    <rect x="19" y="6" width="3" height="1" class="outline" />

    <rect x="20" y="8" width="1" height="2" class="white" />
    <rect x="21" y="8" width="1" height="2" class="pants" />


    <!-- body -->
    <rect x="10" y="16" width="10" height="12" class="outline" />
    <rect x="11" y="22" width="8" height="6" class="outline" />
    <rect x="11" y="16" width="8" height="11" class="vest" />
    

    <!-- arms -->
    
    <rect x="13" y="18" width="5" height="9" class="outline" />
    <rect x="14" y="18" width="3" height="6" class="white" />
    <rect x="14" y="24" width="3" height="2" class="skin" />
    
    
    <!-- scarf -->
    <rect x="9" y="14" width="12" height="1" class="hat-shadow"/>
    <rect x="9" y="15" width="12" height="2" class="hat-shadow"/>
    <rect x="10" y="17" width="10" height="1" class="hat-shadow"/>
    <rect x="10" y="15" width="10" height="2" class="hat-red"/>





    <!-- legs -->
    <rect x="12" y="27" width="6" height="12" class="outline" />
    <rect x="13" y="27" width="4" height="9" class="pants" />
    <rect x="13" y="37" width="4" height="1" class="shoes" />

    
    
    

    
    </g> 
</svg>

    