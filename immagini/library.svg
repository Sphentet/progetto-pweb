<svg width="50" height="50" viewBox="0 0 10 10" >
    <g>    
    
    <!-- Frame Background -->
    <rect x="0" y="0" width="0.95" height="1.3" fill="#E3E4FA" stroke="#707080" stroke-width="0.05" />
    
    <!-- Top White Panel -->
    <rect x="0.05" y="0.06" width="0.85" height="0.3" fill="#FFFFFF" />
    
    <!-- Shelf Area Background (Dark) -->
    <rect x="0.075" y="0.4" width="0.8" height="0.8" fill="#3E3E4E" />
    
    <!-- Shelf Divider -->
    <rect x="0.075" y="0.79" width="0.8" height="0.04" fill="#9FA0B0" />

    <!-- Top Shelf Books -->
    <rect x="0.105" y="0.51" width="0.08" height="0.27" fill="#FDD835" /> <!-- Yellow -->
    <rect x="0.195" y="0.51" width="0.08" height="0.27" fill="#66BB6A" /> <!-- Green -->
    <rect x="0.285" y="0.51" width="0.08" height="0.27" fill="#FFE0B2" /> <!-- Beige -->
    <rect x="0.375" y="0.51" width="0.08" height="0.27" fill="#8D6E63" /> <!-- Brown -->
    <rect x="0.465" y="0.51" width="0.08" height="0.27" fill="#FF9800" /> <!-- Orange -->
    <rect x="0.555" y="0.51" width="0.08" height="0.27" fill="#42A5F5" /> <!-- Blue -->
    <rect x="0.645" y="0.51" width="0.08" height="0.27" fill="#F48FB1" /> <!-- Pink -->
    <rect x="0.735" y="0.51" width="0.08" height="0.27" fill="#1E88E5" /> <!-- Dark Blue -->

    <!-- Bottom Shelf Books -->
    <rect x="0.105" y="0.91" width="0.08" height="0.27" fill="#78909C" /> <!-- Grey Blue -->
    <rect x="0.195" y="0.91" width="0.08" height="0.27" fill="#42A5F5" /> <!-- Blue -->
    <rect x="0.285" y="0.91" width="0.08" height="0.27" fill="#66BB6A" /> <!-- Green -->
    <rect x="0.375" y="0.91" width="0.08" height="0.27" fill="#FFCC80" /> <!-- Light Orange -->
    <rect x="0.465" y="0.91" width="0.08" height="0.27" fill="#4CAF50" /> <!-- Green -->
    <rect x="0.775" y="0.91" width="0.08" height="0.27" fill="#B0BEC5" /> <!-- Light Grey -->

    </g>
</svg>

