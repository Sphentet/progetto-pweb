      .top-s   { fill: #A02020; } /* Red Shadow */
      .bot     { fill: #FFFFFF; } /* White Bottom */
      .bot-s   { fill: #C0C0C0; } /* Grey Shadow */
      .mid     { fill: #101010; } /* Black Band */
      .btn     { fill: #FFFFFF; } /* Button White */
      .btn-s   { fill: #D0D0D0; } /* Button Shadow */
    </style>
  </defs>

  <!-- === OUTLINE === -->
  <rect x="14" y="4" width="12" height="1" class="outline" />
