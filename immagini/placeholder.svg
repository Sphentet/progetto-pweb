  <rect x="11" y="34" width="18" height="1" class="outline" />
  <rect x="14" y="35" width="12" height="1" class="outline" />

  <!-- === TOP HALF (Red) === -->
  <rect x="14" y="5" width="12" height="1" class="top" />
  <rect x="11" y="6" width="18" height="1" class="top" />
  <rect x="9" y="7" width="22" height="2" class="top" />
  <rect x="7" y="9" width="26" height="2" class="top" />
  <rect x="6" y="11" width="28" height="3" class="top" />
  <rect x="5" y="14" width="30" height="4" class="top" />
  <rect x="5" y="18" width="11" height="2" class="top" /> <!-- Left of band -->
  <rect x="24" y="18" width="11" height="2" class="top" /> <!-- Right of band -->

  <!-- Highlights (Top Left) -->
  <rect x="12" y="7" width="6" height="2" class="top-h" />
  <rect x="9" y="9" width="4" height="3" class="top-h" />
  <rect x="7" y="12" width="2" height="4" class="top-h" />

  <!-- Shadows (Bottom Right of Top Half) -->
  <rect x="28" y="16" width="4" height="2" class="top-s" />
  <rect x="30" y="14" width="2" height="2" class="top-s" />

  <!-- === MIDDLE BAND (Black) === -->
  <rect x="5" y="20" width="11" height="2" class="mid" />
  <rect x="24" y="20" width="11" height="2" class="mid" />
  <rect x="5" y="22" width="12" height="1" class="mid" /> <!-- Slight curve down -->
  <rect x="23" y="22" width="12" height="1" class="mid" />

  <!-- === BOTTOM HALF (White) === -->
  <rect x="5" y="23" width="30" height="3" class="bot" />
  <rect x="5" y="26" width="30" height="3" class="bot" />
  <rect x="6" y="29" width="28" height="2" class="bot" />
  <rect x="7" y="31" width="26" height="2" class="bot" />
  <rect x="9" y="33" width="22" height="1" class="bot" />
  <rect x="11" y="34" width="18" height="1" class="bot" />
  <rect x="14" y="35" width="12" height="1" class="bot" />

  <!-- Shadows (Bottom Right of White Half) -->
  <rect x="14" y="35" width="12" height="1" class="bot-s" />
  <rect x="18" y="34" width="11" height="1" class="bot-s" />
  <rect x="22" y="33" width="9" height="1" class="bot-s" />
  <rect x="25" y="31" width="8" height="2" class="bot-s" />
  <rect x="28" y="29" width="6" height="2" class="bot-s" />
  <rect x="31" y="26" width="4" height="3" class="bot-s" />

  <!-- === CENTER BUTTON === -->
  <!-- Outer Ring (Black) -->
  <rect x="16" y="16" width="8" height="8" class="outline" />
  <rect x="17" y="15" width="6" height="10" class="outline" />
  <rect x="15" y="17" width="10" height="6" class="outline" />
  
  <!-- Inner Button (White) -->
  <rect x="17" y="17" width="6" height="6" class="btn" />
  <rect x="18" y="16" width="4" height="8" class="btn" />
  <rect x="16" y="18" width="8" height="4" class="btn" />
  
