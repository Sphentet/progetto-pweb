<svg width="400" height="400" viewBox="0 0 40 41" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">

  <defs>
    <style>
      .houtline { fill: #A890A8; }
      .hair     { fill: #E8E0E8; }
      .outline  { fill: #141010; }
      .skin     { fill: #F8D090; } 
      .vest     { fill: #7090C0; } 
      .tie      { fill: #034a05; } 
      .pants    { fill: #223553; } 
      .shoes    { fill: #57331b; } 
      .white    { fill: #FFFFFF; } 
    </style>
  </defs>


  <g transform="translate(7, 0)">

    
    <!-- HAIR -->
    <!-- Hair Shading (Purple/Grey) -->
    <rect x="7" y="0" width="12" height="1" class="houtline" />
    <rect x="6" y="1" width="15" height="1" class="houtline" />
    <rect x="7" y="2" width="15" height="1" class="houtline" />
    <rect x="5" y="3" width="18" height="2" class="houtline" />
    <rect x="6" y="5" width="18" height="1" class="houtline" />
    <rect x="7" y="6" width="17" height="1" class="houtline" />
    <rect x="8" y="7" width="15" height="1" class="houtline" />

    <!-- Top Light Grey -->
    <rect x="7" y="1" width="12" height="1" class="hair" />
    <rect x="9" y="2" width="12" height="1" class="hair" />
    <rect x="7" y="3" width="15" height="1" class="hair" />
    <rect x="6" y="4" width="16" height="1" class="hair" />
    <rect x="8" y="5" width="15" height="2" class="hair" />
    <rect x="9" y="7" width="13" height="1" class="hair" />


    <!-- Head -->
    <rect x="6" y="15" width="18" height="13" class="outline" />

    <rect x="10" y="6" width="10" height="10" class="skin" />
    <rect x="9" y="7" width="12" height="8" class="skin" />
    <rect x="8" y="8" width="14" height="6" class="skin" />




    <!-- body -->
    <rect x="4" y="17" width="22" height="9" class="outline" />
    <rect x="5" y="16" width="20" height="11" class="outline" />
    
    <rect x="6" y="16" width="18" height="11" class="white" />
    
    
    <rect x="9" y="16" width="12" height="11" class="vest" />
    <rect x="10" y="16" width="10" height="1" class="white" />
    <rect x="11" y="17" width="8" height="2" class="white" />
    <rect x="12" y="19" width="6" height="2" class="white" />
    <rect x="13" y="21" width="4" height="1" class="white" />

    <rect x="13" y="16" width="4" height="1" class="tie" />
    <rect x="14" y="16" width="2" height="6" class="tie" />

    <rect x="5" y="17" width="4" height="9" class="white" />
    <rect x="21" y="17" width="4" height="9" class="white" />
    <rect x="8" y="20" width="1" height="4" class="outline" />
    <rect x="21" y="20" width="1" height="4" class="outline" />


    <!-- legs -->
    <rect x="9" y="27" width="12" height="14" class="outline" />
    <rect x="10" y="27" width="4" height="11" class="pants" />
    <rect x="16" y="27" width="4" height="11" class="pants" />
    <rect x="10" y="27" width="10" height="3" class="pants" />

    <rect x="10" y="39" width="4" height="1" class="shoes" />
    <rect x="16" y="39" width="4" height="1" class="shoes" />

    
    
    
    <!-- face -->
    <!-- Eyebrows -->
    <rect x="9" y="8" width="4" height="1" class="houtline" />
    <rect x="17" y="8" width="4" height="1" class="houtline" />

    <!-- Eyes -->
    <rect x="10" y="9" width="2" height="2" class="white" />
    <rect x="18" y="9" width="2" height="2" class="white" />
    <rect x="11" y="9" width="1" height="2" class="pants" />
    <rect x="18" y="9" width="1" height="2" class="pants" />

    <!-- Mustache -->
    <rect x="11" y="12" width="8" height="1" class="white" />
    <rect x="10" y="13" width="10" height="1" class="white" />
    <rect x="12" y="13" width="6" height="1" fill="#d0896a" /> <!-- Shading -->

    <rect x="14" y="12" width="2" height="1" fill="#eec685" />
    
    








    </g> </svg>

    