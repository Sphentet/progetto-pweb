<svg width="512" height="512" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <defs>
    <style>
      .outline { fill: #102010; } /* Dark Green/Black Outline */
      .fur     { fill: #50B050; } /* Grass Green Fur */
      .fur-l   { fill: #90E090; } /* Light Green Highlight */
      .shadow  { fill: #307030; } /* Dark Green Shadow */
      .cream   { fill: #F0F0D0; } /* Cream Face/Belly */
      .cream-s { fill: #C0C0A0; } /* Cream Shadow */
      .flower  { fill: #F06080; } /* Pink Flower */
      .eye     { fill: #201000; } /* Dark Brown Eye */
      .white   { fill: #FFFFFF; } /* Eye White */
    </style>
  </defs>

  <g transform="translate(40, 0) scale(-1, 1)">

  <!-- === TAIL (Diagonal Leaf) === -->
  <!-- Tail Outline -->
  <rect x="6" y="22" width="7" height="7" class="outline" />
  <rect x="5" y="21" width="6" height="6" class="outline" />
  <rect x="4" y="20" width="4" height="4" class="outline" />
  
  <!-- Tail Fill -->
  <rect x="5" y="21" width="2" height="2" class="fur" />
  <rect x="6" y="22" width="4" height="4" class="fur" />
  <rect x="7" y="23" width="5" height="5" class="fur" />

  <!-- Tail Vein (Diagonal) -->
  <rect x="5" y="21" width="1" height="1" class="shadow" opacity="0.5" />
  <rect x="6" y="22" width="1" height="1" class="shadow" opacity="0.5" />
  <rect x="7" y="23" width="1" height="1" class="shadow" opacity="0.5" />
  <rect x="8" y="24" width="1" height="1" class="shadow" opacity="0.5" />
  <rect x="9" y="25" width="1" height="1" class="shadow" opacity="0.5" />
  <rect x="10" y="26" width="1" height="1" class="shadow" opacity="0.5" />
  <rect x="11" y="27" width="1" height="1" class="shadow" opacity="0.5" />
  <rect x="6" y="25" width="2" height="1" class="shadow" opacity="0.5" />
  <rect x="9" y="22" width="1" height="2" class="shadow" opacity="0.5" />
  <rect x="8" y="26" width="1" height="1" class="shadow" opacity="0.5" />
  <rect x="7" y="27" width="1" height="1" class="shadow" opacity="0.5" />
  <rect x="10" y="24" width="1" height="1" class="shadow" opacity="0.5" />
  <rect x="11" y="23" width="1" height="1" class="shadow" opacity="0.5" />

  <!-- === BODY === -->
  <!-- Body Outline -->
  <rect x="13" y="21" width="12" height="10" class="outline" />
  <rect x="14" y="20" width="10" height="1" class="outline" />
  
  <!-- Body Fill -->
  <rect x="14" y="21" width="10" height="9" class="fur" />
  
  <!-- Body Shading -->
  <rect x="23" y="22" width="1" height="7" class="shadow" />
  <rect x="15" y="29" width="8" height="1" class="shadow" />
  
  <!-- Belly Patch -->
  <rect x="16" y="22" width="6" height="7" class="cream" />
  <rect x="17" y="21" width="4" height="1" class="cream" />
  <rect x="21" y="23" width="1" height="5" class="cream-s" /> <!-- Belly Shadow -->

  <!-- === LEGS === -->
  <!-- Left Leg -->
  <rect x="12" y="29" width="4" height="4" class="outline" />
  <rect x="13" y="30" width="2" height="2" class="fur" />
  <rect x="12" y="32" width="1" height="1" class="cream" />
  <rect x="15" y="32" width="1" height="1" class="cream" />
  
  <!-- Right Leg -->
  <rect x="22" y="29" width="4" height="4" class="outline" />
  <rect x="23" y="30" width="2" height="2" class="fur" />
  <rect x="22" y="32" width="1" height="1" class="cream" />
  <rect x="25" y="32" width="1" height="1" class="cream" />

  <!-- === ARMS === -->
  <!-- Left Arm -->
  <rect x="11" y="22" width="3" height="5" class="outline" />
  <rect x="12" y="23" width="1" height="3" class="fur" />
  <rect x="12" y="25" width="1" height="1" class="cream" />

  <!-- Right Arm -->
  <rect x="24" y="22" width="3" height="5" class="outline" />
  <rect x="25" y="23" width="1" height="3" class="fur" />
  <rect x="25" y="25" width="1" height="1" class="cream" />

  <!-- === HEAD === -->
  <!-- Head Outline -->
  <rect x="11" y="7" width="16" height="13" class="outline" />
  <rect x="12" y="20" width="14" height="1" class="outline" />

  <!-- Head Fill -->
  <rect x="12" y="9" width="14" height="10" class="fur" />
  <rect x="13" y="8" width="12" height="1" class="fur" />
  
  <!-- Face Mask (Cream) -->
  <rect x="14" y="14" width="10" height="5" class="cream" />
  <rect x="15" y="13" width="8" height="1" class="cream" />
  <rect x="16" y="12" width="6" height="1" class="cream" />
  <rect x="18" y="11" width="2" height="1" class="cream" /> <!-- Blaze up forehead -->

  <!-- Head Shading -->
  <rect x="14" y="8" width="3" height="2" class="fur-l" /> <!-- Highlight -->
  <rect x="25" y="10" width="1" height="8" class="shadow" /> <!-- Right Shadow -->

  <!-- === EARS (Leaf-like) === -->
  <!-- Left Ear -->
  <rect x="10" y="4" width="4" height="5" class="outline" />
  <rect x="11" y="5" width="2" height="3" class="fur" />
  <rect x="12" y="6" width="1" height="2" class="cream" /> <!-- Inner Ear -->
  
  <!-- Right Ear -->
  <rect x="24" y="4" width="4" height="5" class="outline" />
  <rect x="25" y="5" width="2" height="3" class="fur" />
  <rect x="25" y="6" width="1" height="2" class="cream" /> <!-- Inner Ear -->

  <!-- === FACE DETAILS === -->
  <!-- Eyes -->
  <rect x="14" y="13" width="3" height="4" class="outline" />
  <rect x="15" y="13" width="1" height="2" class="white" />
  <rect x="15" y="15" width="1" height="1" class="eye" />
  
  <rect x="21" y="13" width="3" height="4" class="outline" />
  <rect x="22" y="13" width="1" height="2" class="white" />
  <rect x="22" y="15" width="1" height="1" class="eye" />

  <!-- Nose -->
  <rect x="18" y="16" width="2" height="1" class="outline" />
  
  <!-- Flower on Ear (Accessory) -->
  <rect x="23" y="3" width="3" height="3" class="flower" />
  <rect x="24" y="4" width="1" height="1" class="white" opacity="0.5" />

  <!-- Leaf Collar/Neck -->
  <rect x="12" y="19" width="14" height="1" class="fur-l" />
  <rect x="13" y="20" width="12" height="1" class="fur-l" />
  <rect x="13" y="20" width="12" height="1" class="outline" opacity="0.2" />
</svg>
