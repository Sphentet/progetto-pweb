

<svg width="400" height="400" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">

  <defs>
    <style>
      .outline    { fill: #202020; }
      .hat-red    { fill: #e74c3c; }
      .hat-shadow { fill: #c0392b; }
      .hat-white  { fill: #ecf0f1; }
      .hat-grey   { fill: #95a5a6; }
      .hair       { fill: #2c3e50; }
      .skin       { fill: #ffcc99; }
      .skin-shadow{ fill: #e6b07e; }
      .eye        { fill: #171515; }
      .scarf      { fill: #e74c3c; }
      .vest       { fill: #253f5a; }
      .vest-light { fill: #34495e; }
      .bag        { fill: #f1c40f; }
      .pants      { fill: #11639a; }
      .shoes      { fill: #c0392b; }
      .shoes-dark { fill: #202020; }
      .white      { fill: #ffffff; }
    </style>
  </defs>


  

    
    <g transform="translate(7, 0)">


    

    

    <!-- HAT -->
    <!-- Row 1 -->
    <rect x="12" y="0" width="6" height="1" class="hat-shadow" />
    <rect x="13" y="0" width="4" height="1" class="hat-red" />
    <!-- Row 2 -->
    <rect x="10" y="1" width="10" height="1" class="hat-shadow" />
    <rect x="11" y="1" width="8" height="1" class="hat-red" />
    <!-- Row 3 -->
    <rect x="9" y="2" width="12" height="1" class="hat-shadow" />
    <rect x="10" y="2" width="10" height="1" class="hat-red" />
    <!-- Row 4 -->
    <rect x="8" y="3" width="14" height="1" class="hat-shadow" />
    <rect x="9" y="3" width="12" height="1" class="hat-red" />
    <!-- Row 5 -->
    <rect x="8" y="4" width="14" height="3" class="hat-red" />
    <rect x="7" y="4" width="1" height="3" class="outline" /> <!-- Left Outline -->
    <rect x="22" y="4" width="1" height="3" class="outline" /> <!-- Right Outline -->
    
    
    



    <!-- Head -->
    <rect x="6" y="15" width="18" height="1" class="outline" />

    <rect x="10" y="6" width="10" height="10" class="eye" />
    <rect x="9" y="7" width="12" height="7" class="eye" />
    <rect x="8" y="7" width="14" height="6" class="eye" />




    <!-- body -->
    <rect x="5" y="16" width="20" height="1" class="outline" />
    
    <rect x="6" y="16" width="18" height="1" class="white" />
    
    <rect x="9" y="22" width="12" height="5" class="outline" />
    <rect x="9" y="16" width="12" height="6" class="vest" />
    <rect x="10" y="22" width="10" height="6" class="vest" />
    

    <!-- arms -->
    
    <rect x="4" y="17" width="5" height="12" class="outline" />
    <rect x="5" y="17" width="4" height="9" class="white" />
    <rect x="8" y="20" width="1" height="6" class="outline" />
    <rect x="5" y="26" width="3" height="2" class="skin" />
    
    <rect x="24" y="25" width="5" height="5" class="outline" />
    <rect x="24.6" y="25.6" width="3.8" height="1.7" fill="#e53935" />
    <rect x="24.6" y="27.7" width="3.8" height="1.7" fill="#9e7755" />
    
    
    <rect x="21" y="17" width="5" height="6" class="outline" />
    <rect x="21" y="17" width="4" height="5" class="white" />
    <rect x="21" y="20" width="1" height="2" class="outline" />

    <rect x="26" y="19" width="1" height="2" class="outline" />
    <rect x="27" y="21" width="1" height="2" class="outline" />
    <rect x="22" y="23" width="7" height="1" class="outline" />
    <rect x="23" y="24" width="6" height="1" class="outline" />
    
    <rect x="23" y="19" width="3" height="5" class="white" />
    <rect x="24" y="21" width="3" height="4" class="white" />
    <rect x="25" y="23" width="3" height="3" class="white" />
    <rect x="25" y="26" width="3" height="2" class="skin" />



    
    


    
    


    <!-- scarf -->
    <rect x="8" y="14" width="13" height="1" class="hat-shadow"/>
    <rect x="7" y="15" width="15" height="1" class="hat-shadow"/>
    <rect x="7" y="16" width="16" height="1" class="hat-shadow"/>
    <rect x="8" y="17" width="14" height="1" class="hat-shadow"/>

    <rect x="8" y="16" width="14" height="1" class="hat-red"/>
    <rect x="9" y="15" width="12" height="1" class="hat-red"/>



    <!-- legs -->
    <rect x="9" y="27" width="12" height="12" class="outline" />
    <rect x="10" y="27" width="4" height="9" class="pants" />
    <rect x="16" y="27" width="4" height="9" class="pants" />
    <rect x="10" y="27" width="10" height="3" class="pants" />

    <rect x="10" y="37" width="4" height="1" class="shoes" />
    <rect x="16" y="37" width="4" height="1" class="shoes" />

    
    
    






    </g> 
</svg>

    